apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aws-simulation
resources:
  - ../../base
patches:
  - target: { kind: Namespace, name: shopsphere }
    patch: |-
      - op: replace
        path: /metadata/name
        value: aws-simulation
  - target: { kind: Deployment, name: eyouth-31005141801597-shopsphere-backend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: eyouth-31005141801597-shopsphere-backend:k8s-latest
  - target: { kind: Deployment, name: eyouth-31005141801597-shopsphere-frontend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: eyouth-31005141801597-shopsphere-frontend:k8s-hosts
  - target: { kind: Ingress, name: eyouth-31005141801597-shopsphere-ingress }
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          http:
            paths:
              - path: /api
                pathType: Prefix
                backend:
                  service:
                    name: eyouth-31005141801597-shopsphere-backend
                    port:
                      number: 5000
              - path: /uploads
                pathType: Prefix
                backend:
                  service:
                    name: eyouth-31005141801597-shopsphere-backend
                    port:
                      number: 5000
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: eyouth-31005141801597-shopsphere-frontend
                    port:
                      number: 3000
