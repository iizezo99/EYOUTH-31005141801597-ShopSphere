apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gcp-simulation
resources:
  - ../../base
patches:
  - target: { kind: Namespace, name: shopsphere }
    patch: |-
      - op: replace
        path: /metadata/name
        value: gcp-simulation
  - target: { kind: Deployment, name: eyouth-31005141801597-shopsphere-backend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: pabdulaziz/shopsphere-backend:latest
